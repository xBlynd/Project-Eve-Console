# EVE Project Console Configuration

ollama_base_url: "http://localhost:11434"
default_max_files: 15
default_max_chars: 30000  # Increased from 20000 to 30000 for better context

storage_path: "./storage/eve.db"

# Models
models:
  construction: "eve-cd"
  dev: "eve-dev"

# File extensions to index
file_extensions:
  code:
    - .py
    - .js
    - .ts
    - .jsx
    - .tsx
    - .html
    - .css
    - .scss
    - .cs
    - .java
    - .cpp
    - .c
    - .h
    - .go
    - .rs
    - .rb
    - .php
    - .swift
    - .kt
  docs:
    - .md
    - .txt
    - .rst
    - .doc
    - .docx
  specs:
    - .pdf
  config:
    - .json
    - .yaml
    - .yml
    - .toml
    - .ini
    - .xml
    - .env
  data:
    - .csv
    - .xlsx
    - .xls
  shell:
    - .sh
    - .bash
    - .zsh
    - .ps1
